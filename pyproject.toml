[project]
name = "tzel"
version = "0.1.0"
description = "A lattice-based, free-word-order drawing language with interactive feedback"
requires-python = ">=3.9"
dependencies = ["pillow"]

[project.optional-dependencies]
png = ["cairosvg"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tzel"]
